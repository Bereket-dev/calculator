<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="display-container">
        <div class="display"></div>
        <div class="btn-remove">&LeftArrow;</div>
      </div>

      <div class="row">
        <div class="col btn btn-operator" id="openPar">&#40;</div>
        <div class="col btn btn-operator" id="closePar">&#41;</div>
        <div class="col btn btn-operator" id="percentage">&#x25;</div>
        <div class="col btn btn-clear">CE</div>

        <div class="col btn btn-number">7</div>
        <div class="col btn btn-number">8</div>
        <div class="col btn btn-number">9</div>
        <div class="col btn btn btn-operator">+</div>

        <div class="col btn btn-number">4</div>
        <div class="col btn btn-number">5</div>
        <div class="col btn btn-number">6</div>
        <div class="col btn btn btn-operator">-</div>

        <div class="col btn btn-number">1</div>
        <div class="col btn btn-number">2</div>
        <div class="col btn btn-number">3</div>
        <div class="col btn btn btn-operator">&#215;</div>

        <div class="col btn btn-number">0</div>
        <div class="col btn btn-number">.</div>
        <div class="col btn" onclick="equalTo()">=</div>
        <div class="col btn btn btn-operator">&divide;</div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
